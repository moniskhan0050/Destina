<!DOCTYPE html>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="DESTINA — Bespoke Indian Escapes" />
  <meta property="og:description"
    content="Architects of transcendent Indian journeys. Private aviation, secluded sanctuaries, and singular geography." />

  <!-- Google Fonts Preconnect -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

  <!-- Tailwind CSS CDN with Forms & Container Queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Tailwind Configuration -->
  <script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#2ee6c8',
              cyanHover: '#26cbb0',
              deepTeal: '#07181c',
              oceanNavy: '#041013',
              surfaceTeal: '#092126',
              borderMuted: 'rgba(46, 230, 200, 0.15)',
              muted: 'rgba(255, 255, 255, 0.45)',

<body class="min-h-screen text-white antialiased selection:bg-brand-cyan selection:text-gray-900 bg-[#041013]">

  <!-- HERO VIEWPORT SECTION -->
  <div class="relative min-h-screen flex flex-col justify-between overflow-hidden" id="hero-section">
    <div class="absolute inset-0 -z-10 overflow-hidden" id="hero-background-wrapper"
      data-purpose="hero-background-wrapper">
      <img id="hero-bg-img" alt="4K Aerial Dal Lake Kashmir"
        class="w-full h-full object-cover object-center scale-105 transform filter brightness-95 contrast-[1.05] transition-all duration-1000 ease-out"
        data-purpose="aerial-drone-scenery" src="/images/hero-kashmir-4k.jpg" />
      <div class="absolute inset-0 bg-teal-950/30 mix-blend-multiply pointer-events-none"></div>
      <div class="absolute inset-0 bg-vignette pointer-events-none"></div>
    </div>

    <div id="hero-route-map-container"
      class="absolute inset-0 -z-5 pointer-events-none transition-opacity duration-700">
    </div>

    <!-- NavigationHeader -->
    <header class="w-full px-6 sm:px-10 md:px-14 lg:px-20 pt-8 pb-4 flex items-center justify-between z-30"
      data-purpose="site-header">
      <div class="flex items-center gap-4 sm:gap-6">
        <button id="hamburger-menu-btn" aria-label="Open Navigation Menu"
          class="group flex flex-col justify-center items-start gap-[6px] w-10 h-10 p-2 focus:outline-none transition-all duration-300 rounded-full hover:bg-white/5 cursor-pointer"
          type="button">
          <span
            class="w-7 h-[2px] bg-white transition-all duration-300 group-hover:w-8 group-hover:bg-brand-cyan"></span>
          <span
            class="w-5 h-[2px] bg-white transition-all duration-300 group-hover:w-8 group-hover:bg-brand-cyan"></span>
        </button>

        <button id="ambient-audio-toggle" type="button" aria-label="Toggle ocean soundscape"
          title="Play Ambient Soundscape"
          class="btn-rounded hidden sm:flex items-center gap-2 text-white/70 hover:text-brand-cyan text-[10px] tracking-widest font-mono uppercase transition-colors px-3.5 py-1.5 border border-white/15 hover:border-brand-cyan/40 cursor-pointer">
          <span class="audio-bars flex items-center gap-0.5 h-3">
            <span class="w-[2px] h-2 bg-current inline-block"></span>
            <span class="w-[2px] h-3 bg-current inline-block"></span>
            <span class="w-[2px] h-1.5 bg-current inline-block"></span>
          </span>
          <span class="audio-label hidden md:inline">SOUND: OFF</span>
        </button>
      </div>

      <a class="flex flex-col items-center select-none text-center cursor-pointer group" data-purpose="brand-logo"
        href="#hero-section">
        <span
          class="text-2xl md:text-3xl font-light tracking-ultrawide text-white uppercase leading-none pl-2 group-hover:text-brand-cyan transition-colors">
          DESTINA
        </span>
        <span class="text-[9px] md:text-[10px] tracking-mega text-white/70 uppercase mt-1 pl-2 font-medium">
          BESPOKE INDIAN ESCAPES
        </span>
      </a>

      <div class="flex items-center gap-3 sm:gap-5">
        <div class="hidden sm:block">
          <select data-currency-select aria-label="Select Currency"
            class="btn-rounded bg-black/40 border border-white/20 text-white/80 hover:text-white text-[10px] tracking-wider py-1.5 px-3 focus:border-brand-cyan focus:ring-0 uppercase cursor-pointer">
            <option class="bg-[#041013] text-white" value="INR">INR (₹)</option>
            <option class="bg-[#041013] text-white" value="EUR">EUR (€)</option>
            <option class="bg-[#041013] text-white" value="USD">USD ($)</option>
            <option class="bg-[#041013] text-white" value="GBP">GBP (£)</option>
          </select>
        </div>

        <button id="search-open-btn" aria-label="Search destinations"
          class="w-10 h-10 rounded-full flex items-center justify-center text-white hover:text-brand-cyan hover:bg-white/5 transition-all duration-300 focus:outline-none cursor-pointer"
          type="button">
          <svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
            <path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round"
              stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Hero Main Content -->
    <main class="w-full flex-1 flex flex-col justify-center items-center text-center px-6 md:px-12 my-auto z-20 py-10"
      id="hero-main-content" data-purpose="hero-content">
      <div id="hero-text-container" class="animate-hero-entrance max-w-4xl mx-auto">
        <h1 id="hero-destination-title"
          class="text-4xl sm:text-6xl md:text-7xl lg:text-[5.3rem] font-medium tracking-superwide text-white uppercase leading-none pl-3 drop-shadow-[0_8px_20px_rgba(0,0,0,0.35)] transition-all duration-500">
          KASHMIR
        </h1>
        <h2 id="hero-destination-tagline"
          class="text-xs sm:text-sm md:text-sm tracking-ultrawide text-white/90 uppercase font-light mt-4 pl-2 drop-shadow transition-all duration-500">
          HEAVEN ON EARTH
        </h2>
        <p id="hero-destination-description"
          class="max-w-xl mx-auto text-xs sm:text-sm md:text-[13px] leading-relaxed text-white/80 font-light mt-4 px-4 drop-shadow transition-all duration-500">
          Kashmir has been celebrated for centuries as paradise on earth – its tranquil Dal Lake shikaras, cedar pine
          valleys, and snow-crowned Gulmarg summits.
        </p>
        <div class="mt-8 sm:mt-9 flex flex-col sm:flex-row items-center justify-center gap-4">
          <a class="btn-rounded inline-block bg-[#2ee6c8] hover:bg-[#25c7ad] text-[#072428] font-semibold text-xs tracking-wider uppercase px-9 py-3.5 transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-[0_10px_25px_rgba(46,230,200,0.35)] active:translate-y-0 text-center"
            data-purpose="cta-explore-button" href="#journey-architect">
            Explore Escapes
          </a>
          <button id="hero-explore-details-btn"
            class="btn-rounded inline-block ocean-glass hover:border-brand-cyan text-white text-xs tracking-wider uppercase px-8 py-3.5 transition-all duration-300 cursor-pointer">
            View Route Details
          </button>
        </div>
      </div>
    </main>

    <footer class="w-full px-6 sm:px-12 lg:px-20 pb-8 pt-4 z-30" data-purpose="timeline-carousel-navigation">
      <div class="max-w-7xl mx-auto">
        <nav aria-label="Destination Slider" id="timeline-navigation"
          class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 lg:gap-8 items-center">
          <button type="button" data-dest-index="0" aria-current="step"
            class="timeline-waypoint group flex flex-col justify-end text-left focus:outline-none cursor-pointer">
            <div class="flex items-center space-x-3 mb-2">
              <span class="waypoint-num text-xs sm:text-sm font-semibold tracking-wider text-brand-cyan">01</span>
              <div class="h-[1.5px] flex-1 bg-white/25 rounded-full overflow-hidden">
                <div class="waypoint-bar h-full bg-brand-cyan w-full transition-all duration-500"></div>
              </div>
            </div>
            <div
              class="waypoint-label text-[11px] sm:text-xs font-medium tracking-widest text-white uppercase group-hover:text-brand-cyan transition-colors">
              Kashmir
            </div>
          </button>

          <button type="button" data-dest-index="1"
            class="timeline-waypoint group flex flex-col justify-end text-left focus:outline-none cursor-pointer">
            <div class="flex items-center space-x-3 mb-2">
              <span
                class="waypoint-num text-xs sm:text-sm font-medium tracking-wider text-white/50 group-hover:text-white transition-colors">02</span>
              <div
                class="h-[1.5px] flex-1 bg-white/20 rounded-full group-hover:bg-white/40 transition-colors overflow-hidden">
                <div class="waypoint-bar h-full bg-brand-cyan w-0 transition-all duration-500"></div>
              </div>
            </div>
            <div
              class="waypoint-label text-[11px] sm:text-xs font-light tracking-widest text-white/60 uppercase group-hover:text-white transition-colors">
              Kerala
            </div>
          </button>

          <button type="button" data-dest-index="2"
            class="timeline-waypoint group flex flex-col justify-end text-left focus:outline-none cursor-pointer">
            <div class="flex items-center space-x-3 mb-2">
              <span
                class="waypoint-num text-xs sm:text-sm font-medium tracking-wider text-white/50 group-hover:text-white transition-colors">03</span>
              <div
                class="h-[1.5px] flex-1 bg-white/20 rounded-full group-hover:bg-white/40 transition-colors overflow-hidden">
                <div class="waypoint-bar h-full bg-brand-cyan w-0 transition-all duration-500"></div>
              </div>
            </div>
            <div
              class="waypoint-label text-[11px] sm:text-xs font-light tracking-widest text-white/60 uppercase group-hover:text-white transition-colors">
              Rajasthan
            </div>
          </button>

          <button type="button" data-dest-index="3"
            class="timeline-waypoint group flex flex-col justify-end text-left focus:outline-none cursor-pointer">
            <div class="flex items-center space-x-3 mb-2">
              <span
                class="waypoint-num text-xs sm:text-sm font-medium tracking-wider text-white/50 group-hover:text-white transition-colors">04</span>
              <div
                class="h-[1.5px] flex-1 bg-white/20 rounded-full group-hover:bg-white/40 transition-colors overflow-hidden">
                <div class="waypoint-bar h-full bg-brand-cyan w-0 transition-all duration-500"></div>
              </div>
            </div>
            <div
              class="waypoint-label text-[11px] sm:text-xs font-light tracking-widest text-white/60 uppercase group-hover:text-white transition-colors">
              Andaman & Nicobar
            </div>
          </button>
        </nav>
      </div>
    </footer>
  </div>

  <div id="global-modal-overlay"
    class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div id="modal-inner-container" class="scale-95 opacity-0 transition-all duration-300 w-full flex justify-center">
    </div>
  </div>

  <!-- Entry Script for Vite -->
  <link rel="stylesheet" href="/index-BB_x8O4h.css" />
<script type="module">
document.querySelectorAll('img[src^="/images/"]').forEach(i=>i.src=i.getAttribute('src').replace('/images/','/'));
fetch('/index-BgNZURSp.js').then(r=>r.text()).then(t=>{
  const u=URL.createObjectURL(new Blob([t.split('/images/').join('/')],{type:'text/javascript'}));
  const s=document.createElement('script');s.type='module';s.src=u;
  s.onload=()=>{if(document.readyState!=='loading')document.dispatchEvent(new Event('DOMContentLoaded'))};
  document.body.appendChild(s);
});
</script>

</body>

</html>
